# Local development services. Ports avoid the defaults so they do not collide with a
# Postgres or Redis already running on the machine.
name: architectos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: architectos
      POSTGRES_PASSWORD: architectos # local development only
      POSTGRES_DB: architectos
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architectos -d architectos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
