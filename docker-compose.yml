# Local development services. Ports avoid the defaults so they do not collide with a
# Postgres or Redis already running on the machine.
name: architectos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: architectos
      POSTGRES_PASSWORD: architectos # local development only
      POSTGRES_DB: architectos
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architectos -d architectos"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Rate-limit counters. Port 6380 on the host to avoid a Redis already on 6379.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches all outgoing email in development. Web UI: http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
