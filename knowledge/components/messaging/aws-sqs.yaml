# ARCH-COMP-001 catalog entry. A change is a new version: see docs/architecture/component-catalog.md.
id: messaging/aws-sqs
version: 2
name: Amazon SQS
category: messaging
technology: aws-sqs
node_kinds:
- queue
support_status: supported
description: Amazon Web Services' managed message queue service.
provider:
  name: aws
  service: Amazon Simple Queue Service
hosting: managed
capabilities:
- id: message_queue
  state: native
  provenance:
    kind: documented
    sources:
    - metrics
- id: dead_letter_queue
  state: native
  provenance:
    kind: documented
    sources:
    - metrics
- id: encryption_at_rest
  state: native
  provenance:
    kind: documented
    sources:
    - sse
  note: SSE-SQS or SSE-KMS; whether a queue uses it is its configuration.
configuration:
- property: retention_seconds
  engines:
  - validation
  - capacity
  default: 345600
  provenance:
    kind: documented
    sources:
    - quotas
  description: Messages are retained for 4 days by default.
- property: encryption_at_rest
  engines:
  - security
capacity:
- id: message_size
  unit: B
  scope: message
  value: 1048576
  provenance:
    kind: documented
    sources:
    - quotas
  description: The maximum message size (1 MiB); larger payloads need the Extended Client Library and Amazon S3.
failure_modes:
- id: backlog_growth
  description: Messages accumulate faster than consumers process them.
  impact: Processing is delayed; messages older than the retention period are no longer available.
  signals:
  - messages_visible
  - oldest_message_age
  mitigations:
  - More consumers.
  - An alarm on the visible messages.
  provenance:
    kind: documented
    sources:
    - metrics
signals:
- id: messages_visible
  type: metric
  availability: native
  collection: CloudWatch AWS/SQS ApproximateNumberOfMessagesVisible
  provenance:
    kind: documented
    sources:
    - metrics
- id: oldest_message_age
  type: metric
  availability: native
  unit: s
  collection: CloudWatch AWS/SQS ApproximateAgeOfOldestMessage
  provenance:
    kind: documented
    sources:
    - metrics
security:
- id: encryption_at_rest
  state: native
  property: encryption_at_rest
  provenance:
    kind: documented
    sources:
    - sse
  note: SSE encrypts message bodies, not queue or message metadata.
constraints:
- id: retention_period
  type: hard_limit
  property: retention_seconds
  comparison: between
  minimum: 60
  maximum: 1209600
  severity: high
  provenance:
    kind: documented
    sources:
    - quotas
  description: Message retention is between 60 seconds and 14 days.
  remediation: Choose a retention between 60 and 1,209,600 seconds; keep longer history elsewhere.
sources:
- id: quotas
  name: Amazon SQS message quotas
  reference: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
  version: null
  retrieved: '2026-09-28'
- id: metrics
  name: Available CloudWatch metrics for Amazon SQS
  reference: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html
  version: null
  retrieved: '2026-09-28'
- id: sse
  name: Encryption at rest in Amazon SQS
  reference: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-server-side-encryption.html
  version: null
  retrieved: '2026-09-28'
