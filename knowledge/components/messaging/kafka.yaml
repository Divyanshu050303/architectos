# ARCH-COMP-001 catalog entry. A change is a new version: see docs/architecture/component-catalog.md.
id: messaging/kafka
version: 2
name: Apache Kafka
category: messaging
technology: kafka
node_kinds:
- queue
support_status: supported
description: 'An event streaming platform: events are published, stored durably in partitioned topics and read as
  often as needed.'
provider:
  name: community
  service: Apache Kafka
hosting: null
technology_versions:
- '4.1'
capabilities:
- id: event_streaming
  state: native
  provenance:
    kind: documented
    sources:
    - intro
- id: publish_subscribe
  state: native
  provenance:
    kind: documented
    sources:
    - intro
- id: message_replay
  state: native
  provenance:
    kind: documented
    sources:
    - intro
  note: Events are not deleted after consumption; retention is per topic.
- id: message_ordering
  state: native
  provenance:
    kind: documented
    sources:
    - intro
  note: Within a partition only.
- id: partitioning
  state: native
  provenance:
    kind: documented
    sources:
    - intro
- id: durable_storage
  state: native
  provenance:
    kind: documented
    sources:
    - intro
- id: encryption_in_transit
  state: requires_configuration
  provenance:
    kind: documented
    sources:
    - ssl
  requires:
  - SSL listeners
  note: SSL is disabled by default.
- id: encryption_at_rest
  state: unknown
  provenance:
    kind: unknown
  note: Not addressed by the security documentation cited.
configuration:
- property: partitions
  engines:
  - capacity
  default: 1
  provenance:
    kind: documented
    sources:
    - broker
  description: 'num.partitions: the broker default for automatically created topics.'
- property: replication_factor
  engines:
  - reliability
  default: 1
  provenance:
    kind: documented
    sources:
    - broker
  description: 'default.replication.factor: the broker default for automatically created topics.'
- property: retention_seconds
  engines:
  - capacity
  - cost
  default: 604800
  provenance:
    kind: documented
    sources:
    - broker
  description: log.retention.hours defaults to 168 (7 days).
- property: storage_bytes
  engines:
  - capacity
  - cost
scaling:
- id: partitioning
  state: native
  affects:
  - operations
  provenance:
    kind: documented
    sources:
    - intro
  limitations:
  - Ordering holds within a partition only.
failure_modes:
- id: under_replicated_partitions
  description: A partition has fewer in-sync replicas than replicas.
  impact: Fewer copies of the data are current; losing more brokers can make the partition unavailable.
  signals:
  - under_replicated_partitions
  provenance:
    kind: documented
    sources:
    - monitoring
- id: consumer_lag
  description: A consumer falls behind the latest records of a partition.
  impact: Events are processed later; events older than the retention period are discarded before being read.
  signals:
  - consumer_lag
  provenance:
    kind: inferred
    assumptions:
    - Retention discards old events after the configured period (documented), so a consumer lagging beyond it cannot
      read them.
signals:
- id: under_replicated_partitions
  type: metric
  availability: native
  collection: JMX kafka.server:type=ReplicaManager,name=UnderReplicatedPartitions
  provenance:
    kind: documented
    sources:
    - monitoring
- id: consumer_lag
  type: metric
  availability: native
  collection: JMX consumer-fetch-manager-metrics records-lag-max
  provenance:
    kind: documented
    sources:
    - monitoring
- id: messages_in
  type: metric
  availability: native
  unit: events/second
  collection: JMX BrokerTopicMetrics MessagesInPerSec
  provenance:
    kind: documented
    sources:
    - monitoring
security:
- id: encryption_in_transit
  state: requires_configuration
  property: tls
  requires:
  - SSL listeners
  note: Disabled by default.
  provenance:
    kind: documented
    sources:
    - ssl
- id: encryption_at_rest
  state: unknown
  property: encryption_at_rest
  provenance:
    kind: unknown
sources:
- id: intro
  name: 'Apache Kafka 4.1: Introduction'
  reference: https://kafka.apache.org/41/getting-started/introduction/
  version: '4.1'
  retrieved: '2026-09-28'
- id: broker
  name: 'Apache Kafka 4.1: Broker Configs'
  reference: https://kafka.apache.org/41/configuration/broker-configs/
  version: '4.1'
  retrieved: '2026-09-28'
- id: monitoring
  name: 'Apache Kafka 4.1: Monitoring'
  reference: https://kafka.apache.org/41/operations/monitoring/
  version: '4.1'
  retrieved: '2026-09-28'
- id: ssl
  name: 'Apache Kafka 4.1: Encryption and Authentication using SSL'
  reference: https://kafka.apache.org/41/security/encryption-and-authentication-using-ssl/
  version: '4.1'
  retrieved: '2026-09-28'
